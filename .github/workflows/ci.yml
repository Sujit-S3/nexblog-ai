name: Enterprise CI/CD Pipeline - AI Knowledge & Content Operating System

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  lint-and-validate:
    name: 1. Code Linting & Zod Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefix api && npm ci --prefix client

      - name: Lint Frontend (ESLint, zero warnings allowed)
        run: npm --prefix client run lint

      - name: Lint Backend (ESLint, errors block CI; warnings are a tracked backlog)
        run: npm --prefix api run lint

  test-suite:
    name: 2. Automated & Architectural Fitness Testing Suite
    needs: lint-and-validate
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      NODE_ENV: testing
      DEPLOYMENT_PROFILE: testing
      MONGO: mongodb://localhost:27017/test_ai_os
      JWT_SECRET: supersecretjwtkeytesting12345
      GEMINI_API_KEY: mock_gemini_key_for_testing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install API Dependencies
        run: npm ci --prefix api

      - name: Run Architectural Fitness Tests (Hexagonal Boundaries)
        working-directory: api
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js __tests__/architecture/fitness.test.js --passWithNoTests

      - name: Run Unit Tests (Orchestrator, Retrieval, Queue, Evaluation)
        working-directory: api
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js __tests__/unit/ --passWithNoTests

      - name: Run Integration Tests
        working-directory: api
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js __tests__/integration/ --passWithNoTests

  build:
    name: 3. Production Frontend & Backend Bundle Build
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Build Vite Production Bundle
        run: npm --prefix client run build

  security-scan:
    name: 4. OWASP Dependency Security Audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefix api && npm ci --prefix client

      # Gated at "critical" — both packages are clean at that level today (api: 0
      # findings of any severity; client: 0 critical, 2 known high). The 2 remaining
      # client highs (react-router-dom open-redirect, vite path-traversal) only have
      # fixes via a major version bump (react-router 7.x, vite 8.x) — real migrations,
      # not safe patches, tracked as a separate follow-up rather than blocking here.
      - name: Audit API dependencies (fails on critical)
        run: npm audit --prefix api --audit-level=critical

      - name: Audit client dependencies (fails on critical)
        run: npm audit --prefix client --audit-level=critical
